name: "Master (Test & Build)"
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Run tests with coverage
        run: flutter test -r expanded --coverage
      - name: Run Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-android:
    name: "Build Demo (Android)"
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: github.repository == 'fleaflet/flutter_map'
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build Android app
        run: flutter build apk --dart-define=COMMIT_SHA=${{ github.sha }}
      - name: Rename output APK
        run: mv build/app/outputs/apk/release/app-release.apk build/app/outputs/apk/release/android-demo.apk
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          path: example/build/app/outputs/apk/release/android-demo.apk
          if-no-files-found: error
          archive: false
      - name: Generate artifact attestation
        uses: actions/attest@v4

  build-windows:
    name: "Build Demo (Windows)"
    runs-on: windows-latest
    needs: [run-tests]
    if: github.repository == 'fleaflet/flutter_map'
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Build Windows app
        run: flutter build windows --dart-define=COMMIT_SHA=${{ github.sha }}
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Generate app installer
        run: iscc "windows/installer-config.iss"
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          path: example/build/windows/output/windows-demo.exe
          if-no-files-found: error
          archive: false
      - name: Generate artifact attestation
        uses: actions/attest@v4

  build-web:
    name: "Build & Deploy Demo (Web)"
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: github.repository == 'fleaflet/flutter_map'
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build web app
        run: flutter build web --wasm --dart-define=COMMIT_SHA=${{ github.sha }}
      - name: Compress web build
        run: zip -r web-demo.zip build/web
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          path: example/web-demo.zip
          if-no-files-found: error
          archive: false
      - name: Generate artifact attestation
        uses: actions/attest@v4
      - name: Deploy app to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLEAFLET }}"
          channelId: live
          projectId: fleaflet-firebase
