name: Publish Package
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"

jobs:
  build-android:
    name: "Build Demo (Android)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Build Android app
        run: flutter build apk --dart-define=COMMIT_SHA=${{ github.sha }}
      - name: Rename output APK
        run: mv build/app/outputs/apk/release/app-release.apk build/app/outputs/apk/release/android-demo.apk
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          path: example/build/app/outputs/apk/release/android-demo.apk
          if-no-files-found: error
          archive: false

  build-windows:
    name: "Build Demo (Windows)"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Build Windows app
        run: flutter build windows --dart-define=COMMIT_SHA=${{ github.sha }}
      - name: Generate app installer
        run: iscc "windows/installer-config.iss"
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          path: example/build/windows/output/windows-demo.exe
          if-no-files-found: error
          archive: false

  build-web:
    name: "Build Demo (Web)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Build web app
        run: flutter build web --wasm --dart-define=COMMIT_SHA=${{ github.sha }}
      - name: Compress web build
        run: zip -r web-demo.zip build/web
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          path: example/web-demo.zip
          if-no-files-found: error
          archive: false

  pub-publish:
    name: "Publish to pub.dev"
    needs: [build-android, build-windows, build-web]
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: "pub.dev"

  gh-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-web, pub-publish]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
          skip-decompress: true
      - name: Attest build artifacts
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.*
      - name: Create GitHub release
        uses: ncipollo/release-action@389305c50bc7406ce7e55077eb8b863e0f0a3083
        with:
          artifacts: artifacts/*.*
          prerelease: ${{contains(github.ref_name, '-dev')}}
          generateReleaseNotes: true
          immutableCreate: true
